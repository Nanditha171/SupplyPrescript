services:
  db:
    image: postgres:16-alpine
    container_name: supply_prescript_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: supply_prescript
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supply_prescript"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: supply_prescript_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@db:5432/supply_prescript
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m database.seed &&
             uvicorn src.api.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: .
    container_name: supply_prescript_frontend
    restart: always
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8000/api
      DATABASE_URL: postgresql+psycopg://postgres:password@db:5432/supply_prescript
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  pgdata:

